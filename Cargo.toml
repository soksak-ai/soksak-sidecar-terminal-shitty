[package]
name = "soksak-sidecar-terminal-shitty"
version = "0.0.1"
edition = "2021"
publish = false
license = "MIT"
description = "Shitty terminal-state provider for the Soksak terminal recovery contract."
build = "build.rs"

[lib]
name = "soksak_sidecar_terminal_shitty"
path = "src/lib.rs"

[[bin]]
name = "soksak-sidecar-terminal-shitty"
path = "src/main.rs"

[dependencies]
soksak-kit-sidecar-terminal = { path = "../../soksak-kits/soksak-kit-sidecar-terminal", features = ["integration-tests"] }

[dev-dependencies]
soksak-contract-terminal = { path = "../../soksak-contracts/soksak-contract-terminal" }

[workspace]
