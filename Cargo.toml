[dependencies]
soksak-kit-sidecar-terminal = { git = "https://github.com/soksak-ai/soksak-kit-sidecar-terminal", rev = "f2f48219bde7a981bf4dd18ee193599639c65fe5", features = ["integration-tests"] }

[dev-dependencies]
serde_json = "=1.0.150"
soksak-contract-terminal = { git = "https://github.com/soksak-ai/soksak-contract-terminal", rev = "cab0691a1a01fca7436ac29f6cc2850245788ea6" }

[build-dependencies]
serde_json = "=1.0.150"

