[package]
name = "soksak-sidecar-terminal-shitty"
version = "0.0.10"
edition = "2024"
publish = false
license = "GPL-3.0-or-later"
description = "Shitty terminal-state provider for the Soksak terminal recovery contract."
build = "build.rs"

[lib]
name = "soksak_sidecar_terminal_shitty"
path = "src/lib.rs"

[[bin]]
name = "soksak-sidecar-terminal-shitty"
path = "src/main.rs"

[dependencies]
soksak-kit-sidecar-terminal = { git = "https://github.com/soksak-ai/soksak-kit-sidecar-terminal", rev = "2bac8d2f396b23b88a40aa74e03f9166f487c187", features = ["integration-tests"] }

[dev-dependencies]
serde_json = "=1.0.150"
soksak-contract-terminal = { git = "https://github.com/soksak-ai/soksak-contract-terminal", rev = "cab0691a1a01fca7436ac29f6cc2850245788ea6" }

[build-dependencies]
serde_json = "=1.0.150"

