name: release
on:
  workflow_dispatch:
concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: aarch64-apple-darwin, runner: macos-15 }
          - { target: aarch64-unknown-linux-gnu, runner: ubuntu-24.04-arm }
          - { target: x86_64-apple-darwin, runner: macos-15-intel }
          - { target: x86_64-unknown-linux-gnu, runner: ubuntu-24.04 }
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: soksak-sidecars/soksak-sidecar-terminal-shitty
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { path: soksak-sidecars/soksak-sidecar-terminal-shitty }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: min-median-max/shitty
          ref: dd5c0d8c74f37a69a805a24b160472805a97c869
          path: externals/shitty
      - id: rust-toolchain
        shell: bash
        run: echo "channel=$(sed -n 's/^channel = \"\(.*\)\"/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.channel }}
          targets: ${{ matrix.target }}
      - name: Install Linux SDK requirements
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y clang-20 glslang-tools librsvg2-bin libvulkan-dev libwayland-dev libxkbcommon-dev libxxhash-dev pkg-config python3 ragel wayland-protocols
      - name: Install macOS SDK requirements
        if: runner.os == 'macOS'
        run: |
          if brew tap | grep -Fxq aws/tap; then brew untap aws/tap; fi
          brew install llvm ragel glslang spirv-cross librsvg pkgconf
      - name: Build Shitty SDK
        working-directory: externals/shitty
        shell: bash
        run: |
          if [ "${{ runner.os }}" = macOS ]; then export CC="$(brew --prefix llvm)/bin/clang" CXX="$(brew --prefix llvm)/bin/clang++"; else export CC=clang-20 CXX=clang++-20; fi
          ./build -B .build-vterm --target "${{ matrix.target }}" vterm-c-sdk
      - name: Stage sidecar
        env:
          SOKSAK_SHITTY_VT_SDK: ${{ github.workspace }}/externals/shitty/.build-vterm/vterm-c
        run: ./stage.sh dist "${{ matrix.target }}"
      - id: archive
        shell: bash
        run: |
          version="$(sed -n 's/^version = \"\(.*\)\"/\1/p' Cargo.toml | head -1)"
          manifest_version="$(sed -n 's/.*\"version\": \"\([^\"]*\)\".*/\1/p' sidecar.json | head -1)"
          test "$version" = "$manifest_version"
          out="soksak-sidecar-terminal-shitty-$version-${{ matrix.target }}.tar.gz"
          ./scripts/package-release.sh dist "${{ matrix.target }}" "$out"
          if command -v sha256sum >/dev/null 2>&1; then sha256sum "$out" | tee "$out.sha256"; else shasum -a 256 "$out" | tee "$out.sha256"; fi
          echo "asset=$out" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: dist-${{ matrix.target }}
          path: |
            soksak-sidecars/soksak-sidecar-terminal-shitty/${{ steps.archive.outputs.asset }}
            soksak-sidecars/soksak-sidecar-terminal-shitty/${{ steps.archive.outputs.asset }}.sha256
          if-no-files-found: error
          compression-level: 0
  publish:
    needs: build
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: soksak-sidecars/soksak-sidecar-terminal-shitty
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { path: soksak-sidecars/soksak-sidecar-terminal-shitty }
      - name: Install the immutable public spec package
        run: |
          mkdir -p .dependency/spec-package
          curl -fsSL https://github.com/soksak-ai/soksak-spec/releases/download/v0.0.27/soksak-ai-plugin-spec-0.0.27.tgz -o .dependency/soksak-spec.tgz
          echo "a3991634079056d0066de9ffc1af1bac6d65ecf1eb1c72e3619f8fb136d4c513  .dependency/soksak-spec.tgz" | sha256sum -c -
          tar -xzf .dependency/soksak-spec.tgz -C .dependency/spec-package --strip-components=1
          test -z "$(find .dependency/spec-package -type l -print -quit)"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: soksak-sidecars/soksak-sidecar-terminal-shitty/.dependency/spec-package/package.json
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: dist-*
          path: soksak-sidecars/soksak-sidecar-terminal-shitty/dist
          merge-multiple: true
      - run: |
          version="$(sed -n 's/^version = \"\(.*\)\"/\1/p' Cargo.toml | head -1)"
          node .dependency/spec-package/release-template/sidecar/build-release.mjs --commit "${{ github.sha }}" --tag "v$version" --artifacts dist --out dist-release
      - run: node .dependency/spec-package/release-template/sidecar/validate-with-spec.mjs --spec-package .dependency/spec-package --release-dir dist-release
      - id: release-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ vars.SOKSAK_RELEASE_CLIENT_ID }}
          private-key: ${{ secrets.SOKSAK_RELEASE_PRIVATE_KEY }}
          permission-administration: read
          permission-contents: write
      - name: Collect the canonical public asset set
        run: |
          mkdir publish-assets
          find dist -maxdepth 1 -type f -name '*.tar.gz' -exec cp {} publish-assets/ \;
          cp dist-release/*.json publish-assets/
      - name: Publish immutable release
        env:
          SOKSAK_RELEASE_TOKEN: ${{ steps.release-token.outputs.token }}
          GH_TOKEN: ${{ steps.release-token.outputs.token }}
        run: |
          test "$(gh api "repos/${{ github.repository }}/immutable-releases" --jq '.enabled and .enforced_by_owner')" = true
          node .dependency/spec-package/release-template/publish-canonical-release.mjs --repository "${{ github.repository }}" --commit "${{ github.sha }}" --artifacts "$GITHUB_WORKSPACE/soksak-sidecars/soksak-sidecar-terminal-shitty/publish-assets" --manifest "$GITHUB_WORKSPACE/soksak-sidecars/soksak-sidecar-terminal-shitty/publish-assets/release.json"
